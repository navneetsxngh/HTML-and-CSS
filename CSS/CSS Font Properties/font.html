<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Family Demo</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Story+Script&family=Lovers+Quarrel&family=Caveat+Brush&family=Lacquer&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .story-script-regular {
            font-family: "Story Script", sans-serif;
            font-size: 28px;
        }

        .lovers-quarrel-regular {
            font-family: "Lovers Quarrel", cursive;
            font-size: 32px;
        }

        .caveat-brush-regular {
            font-family: "Caveat Brush", cursive;
            font-size: 26px;
        }

        .lacquer-regular {
            font-family: "Lacquer", system-ui;
            font-size: 26px;
        }

        .helvetica {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 22px;
        }

        p {
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <h1>Font Family</h1>

    <p class="story-script-regular">My Name is Navneet Singh</p>
    <p class="lovers-quarrel-regular">I am a Data Science Student</p>
    <p class="caveat-brush-regular">Learning HTML</p>
    <p class="lacquer-regular">Exploring Google Fonts</p>
    <p class="helvetica">Testing Fonts</p>

</body>
</html>
