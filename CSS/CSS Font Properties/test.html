<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing CSS</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Caveat:wght@400..700&family=Lacquer&family=Lovers+Quarrel&family=Story+Script&display=swap" rel="stylesheet">
</head>
<style>
    html{
        font-size: 30px;
    }
    body{
        background-color: cornflowerblue;
        color: white;
        font-size: 18px;
    }
    #color{
        color: coral;
    }
    #font-size{
        font-size: 2rem;
    }
    #font-weight{
        font-weight: 900;
    }
    .story-script-regular {
        font-family: "Story Script", sans-serif;
        font-weight: 400;
        font-style: normal;
    }
    #text-align{
        text-align: right;
    }

</style>
<body>
    <h1>Important CSS Properties</h1>
    <p id="color">Color</p>
    <p id="font-size">Font Size</p>
    <p id="font-weight">Font weight</p>
    <p class="story-script-regular">Font Family</p>
    <p id="text-align">Text Align</p>
</body>
</html>
